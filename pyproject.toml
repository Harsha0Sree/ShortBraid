[project]
name = "shortbraid"
version = "0.2.0"
description = "Production-grade LLM context compression, reversible retrieval (CCR), transparent proxy & agent memory"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ShortBraid Team", email = "team@shortbraid.dev" }]
maintainers = [{ name = "ShortBraid Team", email = "team@shortbraid.dev" }]
keywords = [
    "llm",
    "context-compression",
    "ccr",
    "prompt-caching",
    "fastapi",
    "ai-agents",
    "token-optimization",
    "mcp",
    "reversible-compression",
    "context-retrieval",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: Proxy Servers",
    "Typing :: Typed",
]

dependencies = [
    # Core CLI & utilities
    "click>=8.1.0",
    # Web framework & proxy
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # DB & raw storage
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    # Redis / queues
    "redis>=5.0.0",
    "arq>=0.25.0",
    # Object storage (S3 / MinIO)
    "boto3>=1.34.0",
    # HTTP client for upstream LLMs / OpenAI / Anthropic
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    # Observability
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    # Hashing / utils
    "python-dotenv>=1.0.0",
    # SSE / streaming
    "sse-starlette>=2.1.0",
]

[project.optional-dependencies]
all = [
    "tiktoken>=0.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "flake8>=7.0.0",
    "black>=24.4.0",
    "locust>=2.27.0",
    "mypy>=1.10.0",
    "tiktoken>=0.7.0",
    "build>=1.2.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/Harsha0Sree/ShortBraid"
Documentation = "https://github.com/Harsha0Sree/ShortBraid#readme"
Repository = "https://github.com/Harsha0Sree/ShortBraid.git"
Issues = "https://github.com/Harsha0Sree/ShortBraid/issues"
Changelog = "https://github.com/Harsha0Sree/ShortBraid/releases"

[project.scripts]
shortbraid = "shortbraid.cli.main:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shortbraid*"]
exclude = ["tests*", "scripts*", "sql*", "alembic*"]

[tool.setuptools.package-data]
shortbraid = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]
