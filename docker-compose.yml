# =============================================================
# Development docker-compose
#   - Hot reload enabled (volume mount + uvicorn --reload)
#   - All backing services boot together
#   Usage:
#     cp .env.example .env
#     docker compose up --build
# =============================================================
version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shortbraid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shortbraid_secret}
      POSTGRES_DB: ${POSTGRES_DB:-shortbraid}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shortbraid} -d ${POSTGRES_DB:-shortbraid}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [shortbraid-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [shortbraid-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [shortbraid-net]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb -p local/${MINIO_BUCKET:-shortbraid-ingest} || true;
      mc anonymous set download local/${MINIO_BUCKET:-shortbraid-ingest} || true;
      exit 0;
      "
    networks: [shortbraid-net]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["uvicorn", "shortbraid.server.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks: [shortbraid-net]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["arq", "shortbraid.server.workers.tasks.WorkerSettings"]
    networks: [shortbraid-net]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  shortbraid-net:
    driver: bridge
