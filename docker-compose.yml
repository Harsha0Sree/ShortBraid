services: 

  web: 
    depends_on:
     - db
     - redis
    build: .

    ports:

      - "8000:8000"
      
  db:

    image: postgres

    environment:

      POSTGRES_USER: shortbraid

      POSTGRES_PASSWORD: shanon

      POSTGRES_DB: shanon

    volumes:

      - postgres:/var/lib/postgresql



    ports:

     - "5432:5432"





  redis:

    image: redis

    ports:

     - "6379:6379"

  minio:
    image: quay.io/minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
     - "9000:9000"
     - "9001:9001"
    volumes : 
     - ./minio/data:/data

volumes:

  postgres: 