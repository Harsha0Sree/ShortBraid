services: 

  web: 
    depends_on:
     - db
     - redis
    build: .

    ports:

      - "8000:8000"
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
      
  db:

    image: postgres

    environment:

      POSTGRES_USER: shortbraid

      POSTGRES_PASSWORD: shanon

      POSTGRES_DB: shanon

    volumes:

      - postgres:/var/lib/postgresql



    ports:

     - "5432:5432"





  redis:

    image: redis

    ports:

     - "6379:6379"

  minio:
    image: quay.io/minio/minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
     - "9000:9000"
     - "9001:9001"
    volumes : 
     - minio_data:/data

    command: server /data --console-address ":9001"

volumes:

  postgres: 
  minio_data:
