services: 

  web: 

    build: .

    ports:

      - "8000:8000"
      
  db:

    image: postgres

    environment:

      POSTGRES_USER: shortbraid

      POSTGRES_PASSWORD: shanon

      POSTGRES_DB: shanon

    volumes:

      - postgres:/var/lib/postgresql



    ports:

     - "5432:5432"





  redis:

    image: redis

    ports:

     - "6379:6379"



volumes:

  postgres: