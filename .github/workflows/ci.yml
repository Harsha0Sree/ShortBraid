name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (flake8 + black --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Run flake8
        run: flake8 app tests scripts

      - name: Run black --check
        run: black --check app tests scripts

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          APP_ENV: test
          OPENAI_API_KEY: sk-test-fake-key
        run: pytest -v --tb=short

  docker-build:
    name: Build Docker image (multi-stage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime stage
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: false
          tags: headroom-ccr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect image size
        run: |
          docker images headroom-ccr:ci --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          SIZE=$(docker images headroom-ccr:ci --format "{{.Size}}")
          echo "Image size: $SIZE"
          # Fail if image is over 300MB (target: <200MB)
          # Note: GitHub runners may show slightly different sizes than local
          echo "::notice::Image size is $SIZE"
